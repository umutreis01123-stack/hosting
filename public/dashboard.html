<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
</head>
<body>
    <!-- Owner Şifre Modalı -->
    <div id="owner-modal" class="modal" style="display: none;">
        <div class="modal-content owner-modal-content">
            <h2><i class="fa-solid fa-shield-halved"></i> Güvenlik Doğrulaması</h2>
            <p>Kurucu hesabı tespit edildi. Lütfen güvenlik şifrenizi girin.</p>
            <input type="password" id="owner-password" placeholder="Owner Şifresi...">
            <div id="owner-error" class="error-text"></div>
            <button id="btn-owner-verify" class="btn-primary">Doğrula</button>
            <a href="/auth/logout" class="text-link">Çıkış Yap</a>
        </div>
    </div>

    <!-- Layout -->
    <div class="layout" id="app-layout" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <h2>APEX <span>|</span></h2>
            </div>
            
            <nav class="menu">
                <a href="#" class="active" data-view="projects"><i class="fa-solid fa-server"></i> Projelerim</a>
                <a href="#" data-view="upload"><i class="fa-solid fa-cloud-arrow-up"></i> Yeni Yükle</a>
            </nav>

            <div class="user-profile">
                <img id="user-avatar" src="" alt="Avatar">
                <div class="user-info">
                    <span id="user-name">Kullanıcı Adı</span>
                    <a href="/auth/logout"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Duyurular Alanı -->
            <div id="announcements-area"></div>

            <!-- Projelerim Görünümü -->
            <div id="view-projects" class="view active">
                <div class="header">
                    <h1>Projelerim</h1>
                    <button class="btn-primary" onclick="switchView('upload')"><i class="fa-solid fa-plus"></i> Yeni Proje</button>
                </div>
                <div id="projects-list" class="projects-grid">
                    <!-- JS ile doldurulacak -->
                    <div class="loader">Yükleniyor...</div>
                </div>
            </div>

            <!-- Yeni Yükle Görünümü -->
            <div id="view-upload" class="view">
                <div class="header">
                    <h1>Yeni Proje Yükle</h1>
                </div>
                <div class="upload-card">
                    <form id="upload-form">
                        <div class="form-group">
                            <label>Proje Adı</label>
                            <input type="text" id="up-name" required placeholder="Örn: Müzik Botum">
                        </div>
                        <div class="form-group">
                            <label>Proje Tipi</label>
                            <select id="up-type" required>
                                <option value="bot">Discord Bot (Node.js)</option>
                                <option value="website">Web Sitesi (HTML/Node)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Ana Dosya (Varsayılan: index.js)</label>
                            <input type="text" id="up-main" placeholder="index.js" value="index.js">
                        </div>
                        <div class="form-group">
                            <label>Proje Dosyası (.zip)</label>
                            <div class="file-upload-box" id="file-drop-area">
                                <i class="fa-regular fa-file-zipper"></i>
                                <p>Sürükle bırak veya <span>Dosya Seç</span></p>
                                <input type="file" id="up-file" accept=".zip" required>
                            </div>
                            <div id="file-name-display"></div>
                        </div>
                        
                        <div id="upload-status" class="alert" style="display: none;"></div>

                        <button type="submit" class="btn-primary btn-block" id="btn-upload">Yükle ve Başlat <i class="fa-solid fa-rocket"></i></button>
                    </form>
                </div>
            </div>

            <!-- Proje Detay Görünümü (Editör & Konsol) -->
            <div id="view-project-detail" class="view">
                <div class="header">
                    <div class="back-nav" onclick="switchView('projects')"><i class="fa-solid fa-arrow-left"></i></div>
                    <h1 id="detail-name">Proje Adı</h1>
                    <div class="status-badge" id="detail-status">Durum</div>
                </div>

                <div class="project-controls">
                    <button class="btn-action success" id="btn-start" onclick="projectAction('start')"><i class="fa-solid fa-play"></i> Başlat</button>
                    <button class="btn-action warning" id="btn-restart" onclick="projectAction('restart')"><i class="fa-solid fa-rotate-right"></i> Yeniden Başlat</button>
                    <button class="btn-action danger" id="btn-stop" onclick="projectAction('stop')"><i class="fa-solid fa-stop"></i> Durdur</button>
                    <span class="uptime" id="detail-uptime"><i class="fa-regular fa-clock"></i> 0s</span>
                    <button class="btn-action danger ml-auto" onclick="deleteProject()"><i class="fa-solid fa-trash"></i> Projeyi Sil</button>
                </div>

                <div class="workspace">
                    <!-- Dosya Yöneticisi -->
                    <div class="file-explorer">
                        <div class="panel-header">Dosyalar</div>
                        <div id="file-tree" class="file-tree"></div>
                    </div>

                    <!-- Editör -->
                    <div class="code-editor-area">
                        <div class="panel-header flex-between">
                            <span id="current-file-name">Bir dosya seçin...</span>
                            <button class="btn-small success" id="btn-save-file" disabled><i class="fa-solid fa-floppy-disk"></i> Kaydet (Auto-Restart)</button>
                        </div>
                        <textarea id="code-editor"></textarea>
                    </div>

                    <!-- Terminal -->
                    <div class="terminal-area">
                        <div class="panel-header flex-between">
                            <span><i class="fa-solid fa-terminal"></i> Canlı Konsol</span>
                            <button class="btn-small" onclick="clearTerminal()"><i class="fa-solid fa-eraser"></i></button>
                        </div>
                        <div id="terminal-output" class="terminal-output"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    
    <script src="/js/dashboard.js"></script>
</body>
</html>
