version: '3.8'

services:
  apex-hosting:
    build: .
    container_name: apex-hosting
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # .env dosyanızdaki değerleri buraya girin
      - SESSION_SECRET=${SESSION_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - OWNER_DISCORD_ID=${OWNER_DISCORD_ID}
      - OWNER_PASSWORD=${OWNER_PASSWORD}
      - APP_URL=${APP_URL}
    volumes:
      # Kullanıcı projeleri ve verileri kalıcı olsun
      - apex_projects:/app/projects
      - apex_uploads:/app/uploads
      - apex_data:/app/data
    networks:
      - apex_network

networks:
  apex_network:
    driver: bridge

volumes:
  apex_projects:
  apex_uploads:
  apex_data:
